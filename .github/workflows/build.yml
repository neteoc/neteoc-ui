name: Test build process
on:
  push:
    branches-ignore:
      - main
    paths:
      - 'src/**'
      - '.github/workflows/*build*.yml'
      - 'functions/**'
      - 'public/**'
      - '*.json'
      - '.firebaserc'
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run build