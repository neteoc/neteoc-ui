<table mat-table matSort [dataSource]="dataSource">
    <ng-container matColumnDef="timestamp">
        <th mat-header-cell mat-sort-header *matHeaderCellDef> timestamp </th>
        <td mat-cell *matCellDef="let element"> {{ element.timestamp.toDate() | date:'short' }} </td>
    </ng-container>

    <ng-container matColumnDef="fname">
        <th mat-header-cell mat-sort-header *matHeaderCellDef> name </th>
        <td mat-cell *matCellDef="let element"> {{ element.fname }} {{ element.lname }} </td>
    </ng-container>

    <ng-container matColumnDef="status">
        <th mat-header-cell mat-sort-header *matHeaderCellDef> status </th>
        <td mat-cell *matCellDef="let element">
            <button mat-raised-button color="primary">
                {{ element.status }}
            </button>
        </td>
    </ng-container>

    <ng-container matColumnDef="phone">
        <th mat-header-cell mat-sort-header *matHeaderCellDef> phone </th>
        <td mat-cell *matCellDef="let element">
            <button mat-raised-button color="primary">
                {{ element.phone }}
            </button>
        </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
