<table mat-table [dataSource]="missions" class="mission-table">
    <!-- Position Column -->
    <ng-container matColumnDef="title">
      <th mat-header-cell *matHeaderCellDef>Title</th>
      <td mat-cell *matCellDef="let element">
        <button mat-flat-button color="primary" routerLink="/missions/detail/{{ element.id }}">{{element.title}}</button>
      </td>
    </ng-container>
  
    <!-- Name Column -->
    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef>Description</th>
      <td mat-cell *matCellDef="let element">{{element.description}}</td>
    </ng-container>
  
    <!-- Weight Column -->
    <ng-container matColumnDef="location">
      <th mat-header-cell *matHeaderCellDef>location</th>
      <td mat-cell *matCellDef="let element">{{element.location}}</td>
    </ng-container>
  
    <!-- Symbol Column -->
    <ng-container matColumnDef="action">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let element" class="mission-action">
        <button mat-raised-button routerLink="/missions/signin/{{ element.id }}" color="accent" style="display: inline-block">
            <mat-icon>login</mat-icon>
            Sign In
        </button>
        <button mat-raised-button color="primary" style="display: inline-block">
            <mat-icon>person_add</mat-icon>
            Sign Up
        </button>
        <button mat-raised-button color="warn" >
            <mat-icon>delete</mat-icon>
            Delete
        </button>
        <!-- <button mat-fab color="accent" style="display: inline-block" >Info</button> -->
      </td>
    </ng-container>
  
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
