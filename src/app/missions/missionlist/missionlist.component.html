
<div *ngIf="checkRoles(['member'])"> 
<h1> Upcomming Missions </h1>
<table mat-table [dataSource]="missions" class="mission-table">
    <!-- Position Column -->

    <ng-container matColumnDef="detailsLink">
      <ng-container *ngIf="displayHeaders">
        <th mat-header-cell *matHeaderCellDef>Details</th>
      </ng-container>
      <td mat-cell *matCellDef="let element">
        <button mat-flat-button color="primary" routerLink="/missions/detail/{{ element.id }}">
          <mat-icon>arrow_forward</mat-icon>
        </button>
      </td>
    </ng-container>

    <ng-container matColumnDef="linkedTitle">
      <ng-container *ngIf="displayHeaders">
        <th mat-header-cell *matHeaderCellDef>Title</th>
      </ng-container>
      <td mat-cell *matCellDef="let element" routerLink="/missions/detail/{{ element.id }}">
        <a color="primary" >
          {{element.title}}
        </a>
      </td>
    </ng-container>

    <ng-container matColumnDef="title">
      <ng-container *ngIf="displayHeaders">
        <th mat-header-cell *matHeaderCellDef>Title</th>
      </ng-container>
      <td mat-cell *matCellDef="let element">
        {{element.title}}
      </td>
    </ng-container>
  
    <!-- Name Column -->
    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef>Description</th>
      <td mat-cell *matCellDef="let element" routerLink="/missions/detail/{{ element.id }}">
        {{element.description}}
      </td>
    </ng-container>
  
    <!-- Weight Column -->
    <ng-container matColumnDef="location">
      <th mat-header-cell *matHeaderCellDef>location</th>
      <td mat-cell *matCellDef="let element">{{element.location}}</td>
    </ng-container>
  
    <!-- Symbol Column -->
    <ng-container matColumnDef="action">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let element" class="mission-action">
        <!-- <button mat-raised-button color="primary" style="display: inline-block">
            <mat-icon>person_add</mat-icon>
            Sign Up
        </button> -->
        <button 
        id="mission-delete" 
        mat-raised-button 
        color="warn"
        [disabled]="!isOwner(element.ownerID)"
        (click)="deleteMission(element.id)" >
            <mat-icon>delete</mat-icon>
            Delete
        </button>
        <!-- <button mat-fab color="accent" style="display: inline-block" >Info</button> -->
      </td>
    </ng-container>

    <ng-container matColumnDef="edit">
      <th mat-header-cell *matHeaderCellDef>Edit</th>
      <td mat-cell *matCellDef="let element" class="mission-action">
        <button 
        id="mission-edit" 
        mat-raised-button 
        color="primary"
        [disabled]="!isOwner(element.ownerID)"
        routerLink="/missions/edit/{{ element.id }}"
         >
            <mat-icon>edit</mat-icon>
            edit
        </button>
        <!-- <button mat-fab color="accent" style="display: inline-block" >Info</button> -->
      </td>
    </ng-container>
  
    <ng-container *ngIf="displayHeaders">
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    </ng-container>
    
    <tr mat-row *matRowDef="let row; let odd = odd; let even = even; columns: displayedColumns;" [class.striped-row-odd]="odd" [class.striped-row-even]="even" ></tr>
  </table>
</div>
