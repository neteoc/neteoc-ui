<mat-card>
    <mat-card-title>Edit Mission</mat-card-title>
    <mat-card-content>
        <form [formGroup]="missionForm" (ngSubmit)="updateMission()">
            <div class="form-fields">
                <mat-form-field>
                    <textarea id="name" matInput formControlName="title" type="text" placeholder="Title"
                        cdkTextareaAutosize #autosize="cdkTextareaAutosize" cdkAutosizeMinRows="1"
                        cdkAutosizeMaxRows="5">
        </textarea>
                    <mat-error>Name is required</mat-error>
                </mat-form-field>
                <mat-form-field>
                    <textarea id="description" matInput type="text" formControlName="description"
                        placeholder="Description" cdkTextareaAutosize #autosize="cdkTextareaAutosize"
                        cdkAutosizeMinRows="5" cdkAutosizeMaxRows="10">
        </textarea>
                    <mat-error>description is required</mat-error>
                </mat-form-field>
                <mat-form-field>
                    <input matInput placeholder="Location" formControlName="location">
                    <mat-error>Location is required</mat-error>
                </mat-form-field>
                <mat-form-field>
                    <input matInput [matDatepicker]="pickerStart" placeholder="Start Date" formControlName="startDate">
                    <mat-datepicker-toggle matSuffix [for]="pickerStart"></mat-datepicker-toggle>
                    <mat-datepicker #pickerStart></mat-datepicker>
                    <mat-error>Start Date is required</mat-error>
                </mat-form-field>
                <mat-form-field>
                    <input matInput [matDatepicker]="pickerEnd" placeholder="End Date" formControlName="endDate">
                    <mat-datepicker-toggle matSuffix [for]="pickerEnd"></mat-datepicker-toggle>
                    <mat-datepicker #pickerEnd></mat-datepicker>
                    <mat-error>End Date is required</mat-error>
                </mat-form-field>
                <mat-checkbox formControlName="signupEnabled">Signup Enabled</mat-checkbox>
                <button mat-flat-button mat-type="submit" color="primary">
                    Save Changes
                </button>
            </div>
        </form>
    </mat-card-content>
</mat-card>
