<mat-toolbar color="primary">
    <mat-icon>local_fire_department</mat-icon>
    <span>{{ title }}</span>

    <a mat-button routerLink="/">Home</a>
    
    <a mat-button routerLink="/missions" routerLinkActive="active">Missions</a>
    <span class="toolbar-spacer"></span>
    <a *ngIf="isAuthenticated; else showLogin" [matMenuTriggerFor]="menu">
        <img id=profile src="{{ photoURL }}" alt=" {{ username }}">
    </a>
    <mat-menu #menu="matMenu">
        <button mat-menu-item routerLink="/profile/{{ uid }}">Profile</button>
        <button mat-menu-item (click)="logout()">Logout</button>
      </mat-menu>




    <ng-template #showLogin>
        <a mat-button (click)="byGoogle()">Login</a>
    </ng-template>

</mat-toolbar>
