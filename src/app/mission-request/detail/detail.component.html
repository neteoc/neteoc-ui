<h1>Mission Request Details</h1>


<div *ngIf="missionRequest">
    <h2>{{ missionRequest.name }}</h2>
    <p><strong>Description:</strong> {{ missionRequest.description }}</p>
    <p><strong>Location:</strong> {{ missionRequest.location }}</p>
    <p><strong>Submitted By:</strong> <a href="/profile/{{ missionRequest.submittedBy }}">User</a></p>
    <!-- Add more fields as necessary -->
</div>
<div *ngIf="!missionRequest">
    <p>Loading...</p>
</div>
