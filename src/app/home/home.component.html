
<div>

</div>

<mat-grid-list cols="2" rowHeight="1:1" role="list" gutterSize="3em">

    <mat-grid-tile role="listitem">
        <mat-grid-tile-header>
            Profile
        </mat-grid-tile-header>

        <mat-grid-tile-footer>
            <button mat-raised-button color="primary">Details</button>
        </mat-grid-tile-footer>
        
        

    </mat-grid-tile>

    <mat-grid-tile role="listitem">
        <mat-grid-tile-header>
            Missions
        </mat-grid-tile-header>

        <app-missionlist [displayedColumns]="['title']"></app-missionlist>


        <mat-grid-tile-footer>
            <button mat-raised-button color="primary" routerLink="/missions">Missions</button>
        </mat-grid-tile-footer>
        
        

    </mat-grid-tile>

</mat-grid-list>
